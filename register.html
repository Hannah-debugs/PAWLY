<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAWLY | Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="register.css" rel="stylesheet">
</head>
<body>
  <header class="bg-white py-3">
    <nav class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
      <a class="logo text-decoration-none" href="index.html">PAWLY ✿</a>
      <div class="nav d-flex">
        <a class="nav-link " href="index.html">Home</a>
        <a class="nav-link " href="media.html">Pet Care</a>
        <a class="nav-link active" href="register.html">Register</a>
        <a class="nav-link " href="index.html#shop">Shop</a>
        <a class="nav-link " href="index.html#categories">Lookbook</a>
        <a class="nav-link " href="media.html#contact">Contact</a>
      </div>
    </nav>
  </header>
  <main class="container py-4">
    <h1 class="display-5 fw-bold mt-3">Join the PAWLY Family</h1>
    <p class="mb-4">Tell us about you and your furry companion.</p>
    <div class="row g-4">
      <div class="col-lg-8"><form class="bg-white p-4 rounded-4" action="#">
        <h2>Your Information</h2>
        <div class="row g-3">
          <div class="col-md-6"><label>Full Name<input class="form-control" type="text" required minlength="3" maxlength="40"></label></div>

          <div class="col-md-6"><label>Email<input class="form-control" type="email" required></label></div>

          <div class="col-md-6"><label>Password<input class="form-control" type="password" required minlength="6"></label></div>

          <div class="col-md-6"><label>Website<input class="form-control" type="url" placeholder="https://example.com"></label></div>

        </div>
        <h2 class="mt-4">About Your Pet</h2>
        <div class="row g-3">
          <div class="col-md-6"><label>Pet Name<input class="form-control" type="text" required></label></div>

          <div class="col-md-6"><label>Birthday<input class="form-control" type="date"></label></div>

          <div class="col-md-6"><label>Age<input class="form-control" type="number" min="0" max="30"></label></div>

          <div class="col-md-6"><label>Pet Type<select class="form-select"><option selected>Dog</option><option>Cat</option></select></label></div>

          <div class="col-12"><label>Favorite Pet:</label>
            <label class="ms-3"><input type="radio" name="pet" checked> Dog</label>
            <label class="ms-3"><input type="radio" name="pet"> Cat</label>
          </div>
          <div class="col-md-6"><label>Visit Time<input class="form-control" type="time"></label></div>

          <div class="col-md-6"><label>Favorite Color<input class="form-control form-control-color" type="color"></label></div>

          <div class="col-12"><label>Energy Level<input class="form-range" type="range" min="1" max="10"></label></div>

          <div class="col-12"><label>Pet Photo<input class="form-control" type="file"></label></div>

          <div class="col-12"><label>About Your Pet<textarea class="form-control" rows="2"></textarea></label></div>

          <div class="col-md-6"><label>Member Code<input class="form-control" value="PAWLY-01" readonly></label></div>

          <div class="col-md-6"><label>Coupon<input class="form-control" placeholder="Coming soon" disabled></label></div>

          <div class="col-12"><label><input type="checkbox" checked> Receive updates</label></div>

          <div class="col-12"><label><input type="checkbox" required> Agree to terms</label></div>

        </div>
        <button class="btn btn-dark rounded-pill mt-4" type="submit">Create Account</button>
      </form></div>
      <aside class="col-lg-4"><div class="side p-4 rounded-4 h-100">
        <img class="w-100 rounded-4" src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=900&q=80" alt="Happy dog">
        <h2 class="mt-4">A little more love, every day.</h2>
        <p>Care guides, fun collections and inspiration for pets.</p>
      </div></aside>
    </div>
  </main>
  <footer class="text-center py-4 mt-5">PAWLY • Made for happier pets • 2026</footer>
</body>
</html>
